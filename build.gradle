plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

repositories { mavenCentral() }
if (providers.gradleProperty('compatModsDir').isPresent()) {
    dependencies { runtimeOnly fileTree(dir: providers.gradleProperty('compatModsDir').get(), include: '*.jar') }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'lodestone_transit_test'
        enableGameTests = true
        enableClientGameTests = true
    }
}
jar { from('LICENSE') { rename { "${it}_lodestone-transit" } } }

// Optional, locally supplied upstream pack; no third-party artwork is redistributed.
if (providers.gradleProperty('p1klResourcePack').isPresent()) {
    tasks.named('runClientGameTest') {
        doFirst {
            def sourcePack = file(providers.gradleProperty('p1klResourcePack').get())
            if (!sourcePack.isFile()) throw new GradleException("Missing p1kl resource pack: $sourcePack")
            copy {
                from sourcePack
                into file(loom.runs.getByName('clientGameTest').runDir + '/resourcepacks')
            }
        }
    }
}
